<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Palestra</title>
<meta name="description" content="Diario di allenamento in palestra: schede, timer di recupero, progressione dei carichi e statistiche. Tutto in locale sul tuo telefono.">
<meta name="theme-color" content="#0a0b0f">
<meta name="color-scheme" content="dark light">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- `black` e non `black-translucent`: con la status bar trasparente iOS disegna
     a tutto schermo ma accorcia il viewport dell'altezza della status bar, e in
     fondo resta una striscia irraggiungibile. iOS legge questo meta quando l'app
     viene aggiunta alla Home, non a ogni avvio. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">

<!-- splash iOS -->
<link rel="apple-touch-startup-image" media="(device-width:440px) and (device-height:956px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1320x2868.png">
<link rel="apple-touch-startup-image" media="(device-width:402px) and (device-height:874px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1206x2622.png">
<link rel="apple-touch-startup-image" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1242x2688.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:812px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width:360px) and (device-height:780px) and (-webkit-device-pixel-ratio:3)" href="icons/splash-1080x2340.png">
<link rel="apple-touch-startup-image" media="(device-width:414px) and (device-height:896px) and (-webkit-device-pixel-ratio:2)" href="icons/splash-828x1792.png">
<link rel="apple-touch-startup-image" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)" href="icons/splash-750x1334.png">

<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="screen" style="display:grid;place-items:center;min-height:70vh">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#d7ff3e" stroke-width="1.9" stroke-linecap="round" style="opacity:.9">
        <path d="M6.5 7.5v9M3.5 9.5v5M17.5 7.5v9M20.5 9.5v5M6.5 12h11"/>
      </svg>
    </div>
  </div>
  <div id="rotate">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="8.75" y="3" width="6.5" height="18" rx="2"/>
      <path d="M12 18.2h.01"/>
      <path d="M20.5 9.5a9 9 0 0 1-3.2 9.6M20.6 6.1v3.5h-3.5"/>
      <path d="M3.5 14.5a9 9 0 0 1 3.2-9.6M3.4 17.9v-3.5h3.5"/>
    </svg>
    <p><strong>Gira il telefono</strong><span>Palestra si usa in verticale.</span></p>
  </div>
  <noscript><p style="padding:30px;text-align:center">Questa app richiede JavaScript attivo.</p></noscript>
</body>
</html>
