<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Provino figure</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  html, body { height: auto !important; overflow: auto !important; position: static !important; }
  body { background: var(--bg); color: var(--txt); font: 13px/1.3 -apple-system, sans-serif; margin: 0; padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--w, 180px), 1fr)); gap: 10px; }
  .cell { background: var(--sur); border-radius: 10px; padding: 6px; }
  .cell h3 { margin: 0 0 2px; font-size: 11px; font-weight: 600; }
  .cell small { color: var(--txt-3); font-size: 10px; }
  .pair { display: flex; }
  .pair > div { flex: 1; min-width: 0; }
  .exfig { width: 100%; max-width: none; height: auto; display: block; }
  input { font: inherit; padding: 4px 8px; margin-bottom: 10px; width: 260px; }
</style>
</head>
<body>
<input id="q" placeholder="filtro: macchina, cavi, id..." >
<div class="grid" id="g"></div>
<script type="module">
const v = '?v=' + Date.now();
const { EXERCISES } = await import('../js/data/exercises.js' + v);
const { mountFigure } = await import('../js/lib/anim.js' + v);
const g = document.getElementById('g');
const q = document.getElementById('q');
function render(f) {
  g.innerHTML = '';
  const only = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
  const list = EXERCISES.filter((e) => (only.length ? only.includes(e.id)
    : !f || (e.id + ' ' + e.eq + ' ' + e.p + ' ' + e.n).toLowerCase().includes(f)));
  for (const e of list) {
    const c = document.createElement('div');
    c.className = 'cell';
    const fasi = (new URLSearchParams(location.search).get('ph') || '0.46,0').split(',').map(Number);
    c.innerHTML = `<h3>${e.n}</h3><small>${e.eq} · ${e.p}</small><div class="pair">${fasi.map((_, i) => `<div class="f${i}"></div>`).join('')}</div>`;
    g.appendChild(c);
    fasi.forEach((ph, i) => mountFigure(c.querySelector('.f' + i), e, { cls: 'exfig', phase: ph }));
  }
}
q.addEventListener('input', () => render(q.value.trim().toLowerCase()));
const sp = new URLSearchParams(location.search);
if (sp.get('w')) g.style.setProperty('--w', sp.get('w') + 'px');
const pre = sp.get('q') || '';
q.value = pre; render(pre.toLowerCase());
window.FIG = { EXERCISES };
</script>
</body>
</html>
